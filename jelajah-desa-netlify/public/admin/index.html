<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin | Jelajah Desa</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="admin.css" rel="stylesheet">
</head>
<body>
<div class="d-flex">
<aside class="side offcanvas-lg offcanvas-start p-3" id="side" tabindex="-1">
  <div class="text-white fw-bold fs-5 mb-3"><i class="bi bi-tree-fill"></i> <span id="siteName">Jelajah Desa</span></div>
  <nav class="d-grid gap-1" id="menu"></nav>
</aside>
<main class="flex-grow-1 p-3 p-lg-4" style="min-width:0">
  <div class="d-flex align-items-center gap-3 mb-4">
    <button class="btn btn-outline-dark d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#side" aria-label="Buka menu"><i class="bi bi-list"></i></button>
    <h1 class="h4 fw-bold mb-0" id="title">Memuat...</h1>
    <span class="ms-auto small text-muted d-none d-sm-inline" id="who"></span>
  </div>
  <div id="view"></div>
</main>
</div>
<div class="toast-container position-fixed top-0 end-0 p-3" id="toasts" style="z-index:2000"></div>
<div class="modal fade" id="confirmModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content">
  <div class="modal-body"><h2 class="h5" id="cmTitle">Hapus data?</h2><p class="mb-0" id="cmText"></p></div>
  <div class="modal-footer border-0"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Batal</button><button type="button" class="btn btn-danger" id="cmOk">Ya, hapus</button></div>
</div></div></div>
<div class="modal fade" id="infoModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content">
  <div class="modal-header"><h2 class="h5 mb-0" id="imTitle"></h2><button class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button></div>
  <div class="modal-body" id="imBody"></div>
</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/common.js"></script>
<script src="admin-core.js"></script>
<script src="admin-content.js"></script>
<script src="admin-system.js"></script>
<script src="admin.js"></script>
</body>
</html>
