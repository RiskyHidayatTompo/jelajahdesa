<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login Admin | Jelajah Desa</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="admin.css" rel="stylesheet">
</head>
<body class="login-page">
<main class="box">
  <div class="text-center mb-3"><i class="bi bi-tree-fill fs-1" style="color:#3b8a5b"></i><h1 class="h4 fw-bold" style="color:#1d4a37">Login Admin</h1><p class="text-muted small mb-0" id="siteName">Jelajah Desa</p></div>
  <div id="msg"></div>
  <div id="already" hidden>
    <div class="alert alert-success">Anda sudah masuk sebagai <b id="who"></b>.</div>
    <a class="btn btn-forest w-100 mb-2" href="index.html">Buka Dashboard</a>
    <button class="btn btn-outline-secondary w-100" style="border-radius:999px" id="switch">Keluar dan login dengan akun lain</button>
  </div>
  <form id="form" novalidate>
    <label class="form-label" for="email">Email</label>
    <input class="form-control mb-3" id="email" type="email" required autocomplete="username">
    <label class="form-label" for="pw">Password</label>
    <div class="input-group mb-4"><input class="form-control" style="border-radius:12px 0 0 12px" type="password" id="pw" required autocomplete="current-password"><button class="btn btn-outline-secondary" type="button" id="tg" style="border-radius:0 12px 12px 0" aria-label="Tampilkan password"><i class="bi bi-eye"></i></button></div>
    <button class="btn btn-forest w-100" id="go">Login</button>
  </form>
  <a class="d-block text-center mt-3 small" href="../index.html">&larr; Kembali ke website</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/common.js"></script>
<script src="login.js"></script>
</body>
</html>
